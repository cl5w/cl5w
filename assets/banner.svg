<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Claw / cl5w</title>
  <desc id="desc">Software developer and founder of Dynasty Plugins. A dark banner with blue accents and a code window.</desc>
  <defs>
