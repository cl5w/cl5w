    <linearGradient id="accent" x1="55" y1="0" x2="1145" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#345ad4"/><stop offset="0.7" stop-color="#a3b6ff"/><stop offset="1" stop-color="#345ad4" stop-opacity="0.1"/>
