    <text x="56" y="213" fill="#b6c2d6" font-size="21">Minecraft plugins. Discord tools. Web projects.</text>
    <text x="56" y="266" fill="#7f91ad" font-size="13" letter-spacing="1.2">JAVA  /  TYPESCRIPT  /  JAVASCRIPT</text>
